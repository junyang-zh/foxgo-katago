# Safe starter settings; tune numSearchThreads for your CPU/GPU.
logDir = data/katago-logs
logAllGTPCommunication = true
logSearchInfo = true
logToStderr = true
rules = chinese
maxVisits = 200
maxTime = 2.0
numSearchThreads = 4
nnCacheSizePowerOfTwo = 18
nnMutexPoolSizePowerOfTwo = 14
ponderingEnabled = false
reportAnalysisWinratesAs = SIDETOMOVE
allowResignation = true
resignThreshold = -0.95
resignConsecTurns = 5
